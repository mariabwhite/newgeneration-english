<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Premium Login · NG English</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="../assets/nge-favicon-lab.svg">
<script src="./assets/lab-theme-sync.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=Manrope:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f1ff;
  --panel: #ffffff;
  --text: #1a1326;
  --muted: #625a73;
  --line: rgba(122,95,207,0.24);
  --accent: #ff7430;
  --accent-2: #ff5125;
  --ok: #168a5f;
  --err: #c73535;
  --display: "Unbounded", "Manrope", system-ui, sans-serif;
  --body: "Manrope", system-ui, sans-serif;
  --mono: "JetBrains Mono", Consolas, monospace;
}
[data-theme="dark"], [data-theme="black-lab"], [data-theme="violet"] {
  --bg: #0e0a18;
  --panel: #1a1326;
  --text: #f0ebff;
  --muted: #bfaee0;
  --line: rgba(197,174,240,0.24);
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 16px;
  font-family: var(--body);
  color: var(--text);
  background:
    radial-gradient(circle at 82% 8%, rgba(154,122,217,0.24), transparent 36%),
    radial-gradient(circle at 8% 88%, rgba(255,116,48,0.12), transparent 34%),
    var(--bg);
  overflow-x: hidden;
}
.login {
  width: 100%;
  max-width: min(340px, calc(100vw - 32px));
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 28px 22px 24px;
  box-shadow: 0 24px 70px rgba(25, 18, 42, 0.18);
  overflow: hidden;
}
.eyebrow {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 10px;
}
h1 {
  margin: 0 0 8px;
  font-family: var(--display);
  font-size: clamp(24px, 6.5vw, 30px);
  line-height: 1.05;
}
p {
  margin: 0 0 18px;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.5;
}
form { margin: 0; }
label {
  display: block;
  margin: 0 0 8px;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.13em;
  text-transform: uppercase;
}
input {
  width: 100%;
  min-width: 0;
  min-height: 50px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--text);
  font: 700 16px var(--mono);
  padding: 0 46px 0 14px;
  outline: none;
}
input:focus {
  border-color: rgba(255,116,48,0.72);
  box-shadow: 0 0 0 4px rgba(255,116,48,0.12);
}
.pass-wrap { position: relative; }
.eye {
  position: absolute;
  right: 6px;
  top: 50%;
  transform: translateY(-50%);
  width: 40px;
  height: 40px;
  min-height: 40px;
  padding: 0;
  border: none;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  border-radius: 8px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.eye:hover { color: var(--accent); background: rgba(255,116,48,0.08); }
.eye[aria-pressed="true"] { color: var(--accent); }
.actions {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
  margin-top: 14px;
}
button, a.catalog {
  min-height: 48px;
  border-radius: 10px;
  border: 1px solid var(--line);
  padding: 0 16px;
  font: 800 13px var(--body);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  color: var(--text);
}
button {
  background: linear-gradient(180deg, var(--accent) 0%, var(--accent-2) 100%);
  border-color: rgba(255,116,48,0.72);
  color: #fff;
  cursor: pointer;
}
button:disabled { opacity: 0.62; cursor: wait; }
a.catalog { background: transparent; }
.msg {
  min-height: 22px;
  margin-top: 14px;
  font-size: 13px;
  color: var(--muted);
}
.msg.is-ok { color: var(--ok); }
.msg.is-error { color: var(--err); }
.reset {
  margin-top: 14px;
  width: 100%;
  background: transparent;
  color: var(--muted);
  border: 1px dashed var(--line);
  min-height: 42px;
  font-weight: 700;
}
.reset:hover { color: var(--err); border-color: var(--err); background: transparent; }
</style>
</head>
<body>
  <main class="login">
    <div class="eyebrow">NG English · Premium Lab</div>
    <h1>Вход в Lab</h1>
    <p id="lead">Введите общий пароль подписки. После входа откроются все премиальные уроки.</p>
    <form id="loginForm" novalidate>
      <label for="passInput">Пароль</label>
      <div class="pass-wrap">
        <input id="passInput" name="password" type="password" autocomplete="current-password" spellcheck="false" autofocus>
        <button id="eyeBtn" type="button" class="eye" aria-label="Показать пароль" aria-pressed="false">
          <svg id="eyeIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <div class="actions">
        <button id="loginBtn" type="submit">Открыть Lab</button>
        <a class="catalog" href="./premium.html">← В каталог</a>
      </div>
    </form>
    <div class="msg" id="msg">Один пароль на всю подписку.</div>
    <button class="reset" id="resetBtn" type="button">Выйти из Lab (сбросить доступ)</button>
  </main>

<script>
/* Simple vault-flag login.
 * Password is checked via SHA-256 hash — no server round-trip, no per-lesson PIN.
 * On success: localStorage.setItem('nge-lab-unlocked', 'yes') + redirect to ?next=<url> (or ./premium.html).
 * On logout: clear the flag → all premium lessons will redirect back to this page.
 */
const UNLOCK_KEY  = 'nge-lab-unlocked';
const STAMP_KEY   = 'nge-lab-unlocked-at';
const PASS_HASH   = 'e2937adaa5055a2f3aab83730c86589087beec9b44e9db045a47604d97a4845f';
// Legacy keys we clean up on both login and logout so old vault caches never resurrect access unexpectedly:
const LEGACY_KEYS = ['nge-vault-cache', 'nge-vault-cache-v', 'nge-vault-pin'];

const loginForm = document.getElementById('loginForm');
const input     = document.getElementById('passInput');
const btn       = document.getElementById('loginBtn');
const resetBtn  = document.getElementById('resetBtn');
const msg       = document.getElementById('msg');

function safeNextUrl() {
  const next = new URLSearchParams(location.search).get('next');
  if (!next) return './premium.html';
  try {
    const url = new URL(next, location.origin);
    if (url.origin !== location.origin) return './premium.html';
    if (!url.pathname.startsWith('/lingua-boost-lab/')) return './premium.html';
    // Never bounce back to the login page — that IS the loop we are killing.
    if (url.pathname.endsWith('/login.html')) return './premium.html';
    return url.pathname + url.search + url.hash;
  } catch (e) {
    return './premium.html';
  }
}

async function sha256(text) {
  const buf  = new TextEncoder().encode(text);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function clearLegacy() {
  for (const k of LEGACY_KEYS) {
    try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch (_) {}
  }
}

async function handleLogin(event) {
  event.preventDefault();
  const value = (input.value || '').trim();
  if (!value) {
    msg.textContent = 'Введите пароль.';
    msg.className   = 'msg is-error';
    return;
  }
  btn.disabled    = true;
  msg.textContent = 'Проверяю…';
  msg.className   = 'msg';
  try {
    const hash = await sha256(value);
    if (hash !== PASS_HASH) {
      throw new Error('BAD_PASSWORD');
    }
    localStorage.setItem(UNLOCK_KEY, 'yes');
    localStorage.setItem(STAMP_KEY, String(Date.now()));
    clearLegacy();
    msg.textContent = 'Доступ открыт. Открываю урок…';
    msg.className   = 'msg is-ok';
    input.value     = '';
    location.replace(safeNextUrl());
  } catch (err) {
    btn.disabled    = false;
    msg.textContent = 'Пароль не подошёл.';
    msg.className   = 'msg is-error';
  }
}

function handleReset() {
  localStorage.removeItem(UNLOCK_KEY);
  localStorage.removeItem(STAMP_KEY);
  clearLegacy();
  msg.textContent = 'Доступ сброшен. Введите пароль заново.';
  msg.className   = 'msg';
  input.value     = '';
  input.focus();
}

/* If we arrive here already unlocked (e.g. bookmark or manual navigation),
 * jump straight to the next URL or catalog — no reason to sit on login. */
if (localStorage.getItem(UNLOCK_KEY) === 'yes') {
  const target = safeNextUrl();
  if (target && !target.endsWith('/login.html')) {
    // If they explicitly asked for premium.html without a next param, stay put so they can log out.
    if (new URLSearchParams(location.search).has('next')) {
      location.replace(target);
    }
  }
}

loginForm.addEventListener('submit', handleLogin);
resetBtn.addEventListener('click', handleReset);

/* Password visibility toggle */
const eyeBtn  = document.getElementById('eyeBtn');
const eyeIcon = document.getElementById('eyeIcon');
const EYE_OPEN   = '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>';
const EYE_CLOSED = '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-6.5 0-10-7-10-7a19.6 19.6 0 0 1 5.06-5.94"/><path d="M9.9 4.24A10.5 10.5 0 0 1 12 4c6.5 0 10 7 10 7a19.5 19.5 0 0 1-3.16 4.19"/><path d="M14.12 14.12A3 3 0 1 1 9.88 9.88"/><line x1="1" y1="1" x2="23" y2="23"/>';
eyeBtn.addEventListener('click', () => {
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  eyeBtn.setAttribute('aria-pressed', String(show));
  eyeBtn.setAttribute('aria-label', show ? 'Скрыть пароль' : 'Показать пароль');
  eyeIcon.innerHTML = show ? EYE_CLOSED : EYE_OPEN;
  input.focus();
});
</script>
</body>
</html>
