<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="shieldGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE566"/>
      <stop offset="60%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="shieldScarlet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7B0F1F"/>
      <stop offset="100%" stop-color="#3E0810"/>
    </linearGradient>
    <linearGradient id="shieldViolet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E2F5C"/>
      <stop offset="100%" stop-color="#1A1B4B"/>
    </linearGradient>
    <linearGradient id="shieldSilver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EAEAF8"/>
      <stop offset="100%" stop-color="#8888B0"/>
    </linearGradient>
    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <symbol id="shieldShape" viewBox="0 0 100 130">
      <path d="M50 5 L92 15 L92 65 Q92 95 50 125 Q8 95 8 65 L8 15 Z" stroke-width="2" stroke="rgba(255,215,0,.55)"/>
    </symbol>
  </defs>

  <!-- SEEKER — Snitch on scarlet -->
  <g transform="translate(20,50)">
    <path d="M75 5 L138 20 L138 90 Q138 135 75 180 Q12 135 12 90 L12 20 Z" fill="url(#shieldScarlet)" stroke="url(#shieldGold)" stroke-width="2.5"/>
    <!-- inner border -->
    <path d="M75 15 L128 27 L128 88 Q128 128 75 168 Q22 128 22 88 L22 27 Z" fill="none" stroke="rgba(255,215,0,.35)" stroke-width="1"/>
    <!-- Snitch centered -->
    <g transform="translate(75,80)" filter="url(#glowGold)">
      <!-- wings -->
      <path d="M-30 0 Q-18 -20 -4 -6 Q-16 4 -30 0 Z" fill="#EAEAF8" opacity="0.9"/>
      <path d="M30 0 Q18 -20 4 -6 Q16 4 30 0 Z" fill="#EAEAF8" opacity="0.9"/>
      <!-- body -->
      <circle r="14" fill="url(#shieldGold)" stroke="#8B6914" stroke-width="1"/>
      <ellipse cx="-3" cy="-3" rx="4" ry="2.5" fill="#FFF4A0" opacity="0.85"/>
    </g>
    <!-- Label -->
    <rect x="12" y="150" width="126" height="34" rx="6" fill="rgba(11,10,32,.75)" stroke="url(#shieldGold)" stroke-width="1"/>
    <text x="75" y="167" text-anchor="middle" fill="#FFD700" font-family="Unbounded,Inter,sans-serif" font-weight="900" font-size="14" letter-spacing="2.5">SEEKER</text>
    <text x="75" y="180" text-anchor="middle" fill="#EAEAF8" font-family="Manrope,sans-serif" font-size="8.5" letter-spacing="1">catches the Snitch</text>
  </g>

  <!-- CHASER — Quaffle on twilight blue -->
  <g transform="translate(210,50)">
    <path d="M75 5 L138 20 L138 90 Q138 135 75 180 Q12 135 12 90 L12 20 Z" fill="url(#shieldViolet)" stroke="url(#shieldGold)" stroke-width="2.5"/>
    <path d="M75 15 L128 27 L128 88 Q128 128 75 168 Q22 128 22 88 L22 27 Z" fill="none" stroke="rgba(255,215,0,.35)" stroke-width="1"/>
    <!-- Quaffle -->
    <g transform="translate(75,80)">
      <circle r="26" fill="#8B1A1A" stroke="#4E0808" stroke-width="1.5"/>
      <circle r="20" fill="none" stroke="#5A0C0C" stroke-width="0.8"/>
      <!-- laces -->
      <line x1="0" y1="-16" x2="0" y2="16" stroke="#3A0808" stroke-width="1.5"/>
      <line x1="-6" y1="-8" x2="6" y2="-8" stroke="#3A0808" stroke-width="1"/>
      <line x1="-6" y1="-2" x2="6" y2="-2" stroke="#3A0808" stroke-width="1"/>
      <line x1="-6" y1="4" x2="6" y2="4" stroke="#3A0808" stroke-width="1"/>
      <line x1="-6" y1="10" x2="6" y2="10" stroke="#3A0808" stroke-width="1"/>
      <ellipse cx="-6" cy="-8" rx="5" ry="3" fill="rgba(230,144,144,.35)"/>
    </g>
    <rect x="12" y="150" width="126" height="34" rx="6" fill="rgba(11,10,32,.75)" stroke="url(#shieldGold)" stroke-width="1"/>
    <text x="75" y="167" text-anchor="middle" fill="#FFD700" font-family="Unbounded,Inter,sans-serif" font-weight="900" font-size="14" letter-spacing="2.5">CHASER</text>
    <text x="75" y="180" text-anchor="middle" fill="#EAEAF8" font-family="Manrope,sans-serif" font-size="8.5" letter-spacing="1">throws the Quaffle</text>
  </g>

  <!-- KEEPER — Hoop on silver -->
  <g transform="translate(400,50)">
    <path d="M75 5 L138 20 L138 90 Q138 135 75 180 Q12 135 12 90 L12 20 Z" fill="url(#shieldViolet)" stroke="url(#shieldGold)" stroke-width="2.5"/>
    <path d="M75 15 L128 27 L128 88 Q128 128 75 168 Q22 128 22 88 L22 27 Z" fill="none" stroke="rgba(255,215,0,.35)" stroke-width="1"/>
    <!-- Hoop with post -->
    <g transform="translate(75,85)">
      <!-- post -->
      <rect x="-3" y="0" width="6" height="45" fill="url(#shieldSilver)"/>
      <!-- hoop ring -->
      <ellipse cx="0" cy="0" rx="30" ry="9" fill="none" stroke="url(#shieldSilver)" stroke-width="5"/>
      <ellipse cx="0" cy="0" rx="30" ry="9" fill="none" stroke="#5A5A78" stroke-width="1"/>
      <!-- top ornament -->
      <circle cx="0" cy="-4" r="3" fill="url(#shieldGold)"/>
    </g>
    <rect x="12" y="150" width="126" height="34" rx="6" fill="rgba(11,10,32,.75)" stroke="url(#shieldGold)" stroke-width="1"/>
    <text x="75" y="167" text-anchor="middle" fill="#FFD700" font-family="Unbounded,Inter,sans-serif" font-weight="900" font-size="14" letter-spacing="2.5">KEEPER</text>
    <text x="75" y="180" text-anchor="middle" fill="#EAEAF8" font-family="Manrope,sans-serif" font-size="8.5" letter-spacing="1">guards the hoops</text>
  </g>

  <!-- BEATER — Bat + Bludger on dark -->
  <g transform="translate(590,50)">
    <path d="M75 5 L138 20 L138 90 Q138 135 75 180 Q12 135 12 90 L12 20 Z" fill="url(#shieldViolet)" stroke="url(#shieldGold)" stroke-width="2.5"/>
    <path d="M75 15 L128 27 L128 88 Q128 128 75 168 Q22 128 22 88 L22 27 Z" fill="none" stroke="rgba(255,215,0,.35)" stroke-width="1"/>
    <!-- Bat (diagonal) -->
    <g transform="translate(75,80) rotate(-32)">
      <!-- handle -->
      <rect x="-2.5" y="8" width="5" height="30" fill="#5C3317" rx="1"/>
      <!-- knob -->
      <circle cx="0" cy="38" r="4" fill="#3E2010"/>
      <!-- bat head -->
      <ellipse cx="0" cy="-8" rx="10" ry="22" fill="#8B6914" stroke="#5C3317" stroke-width="1"/>
      <ellipse cx="-3" cy="-14" rx="3" ry="8" fill="rgba(255,229,102,.35)"/>
    </g>
    <!-- Bludger (small dark ball) -->
    <g transform="translate(105,55)">
      <circle r="12" fill="#1F1F1F" stroke="#4A4A4A" stroke-width="1.5"/>
      <circle cx="-3" cy="-3" r="3" fill="rgba(184,184,232,.25)"/>
      <circle cx="0" cy="0" r="6" fill="none" stroke="#3A3A3A" stroke-width="0.8"/>
    </g>
    <rect x="12" y="150" width="126" height="34" rx="6" fill="rgba(11,10,32,.75)" stroke="url(#shieldGold)" stroke-width="1"/>
    <text x="75" y="167" text-anchor="middle" fill="#FFD700" font-family="Unbounded,Inter,sans-serif" font-weight="900" font-size="14" letter-spacing="2.5">BEATER</text>
    <text x="75" y="180" text-anchor="middle" fill="#EAEAF8" font-family="Manrope,sans-serif" font-size="8.5" letter-spacing="1">hits the Bludgers</text>
  </g>

  <!-- Bottom accent line -->
  <line x1="20" y1="245" x2="780" y2="245" stroke="url(#shieldGold)" stroke-width="0.8" opacity="0.4"/>
</svg>
