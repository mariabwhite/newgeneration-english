<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F0F2E"/>
      <stop offset="40%" stop-color="#1A1B4B"/>
      <stop offset="80%" stop-color="#2E1F5C"/>
      <stop offset="100%" stop-color="#1A1B4B"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF9E0"/>
      <stop offset="70%" stop-color="#EAEAF8"/>
      <stop offset="100%" stop-color="#B8B8E8"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,249,224,.4)"/>
      <stop offset="100%" stop-color="rgba(255,249,224,0)"/>
    </radialGradient>
    <radialGradient id="snitchBody" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF4A0"/>
      <stop offset="60%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </radialGradient>
    <radialGradient id="snitchGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,215,0,.55)"/>
      <stop offset="100%" stop-color="rgba(255,215,0,0)"/>
    </radialGradient>
    <linearGradient id="hoopMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EAEAF8"/>
      <stop offset="100%" stop-color="#8888B0"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(15,15,46,0)"/>
      <stop offset="100%" stop-color="rgba(11,10,32,1)"/>
    </linearGradient>
    <filter id="starGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1"/>
    </filter>
    <filter id="blur3">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <symbol id="star" viewBox="-4 -4 8 8">
      <circle r="1" fill="#EAEAF8"/>
    </symbol>
    <symbol id="broomPlayer" viewBox="-40 -20 80 40">
      <!-- broom shaft -->
      <line x1="-32" y1="8" x2="30" y2="-8" stroke="#5C3317" stroke-width="3" stroke-linecap="round"/>
      <!-- broom bristles -->
      <path d="M28 -10 L38 -14 M28 -8 L40 -10 M28 -6 L38 -4 M30 -8 L36 0" stroke="#8B6914" stroke-width="1.6" stroke-linecap="round"/>
      <!-- rider body -->
      <circle cx="0" cy="-2" r="5" fill="#252651"/>
      <path d="M-4 4 L-10 12 M4 4 L10 12" stroke="#252651" stroke-width="3" stroke-linecap="round"/>
      <path d="M-2 2 L-8 -4 M2 2 L6 -6" stroke="#252651" stroke-width="2.5" stroke-linecap="round"/>
      <!-- head -->
      <circle cx="0" cy="-8" r="3.5" fill="#252651"/>
      <!-- cape flowing -->
      <path d="M-3 -3 Q-12 2 -18 8" stroke="#C41E3A" stroke-width="2.5" fill="none" opacity="0.85"/>
    </symbol>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="500" fill="url(#sky)"/>

  <!-- Nebula wisps -->
  <ellipse cx="200" cy="120" rx="220" ry="60" fill="rgba(167,139,250,.10)" filter="url(#blur3)"/>
  <ellipse cx="900" cy="180" rx="280" ry="80" fill="rgba(196,30,58,.08)" filter="url(#blur3)"/>
  <ellipse cx="600" cy="60" rx="320" ry="40" fill="rgba(184,184,232,.06)" filter="url(#blur3)"/>

  <!-- Moon top-left -->
  <circle cx="180" cy="110" r="90" fill="url(#moonGlow)"/>
  <circle cx="180" cy="110" r="55" fill="url(#moon)"/>
  <circle cx="165" cy="98" r="8" fill="rgba(139,120,180,.35)"/>
  <circle cx="195" cy="120" r="5" fill="rgba(139,120,180,.30)"/>
  <circle cx="185" cy="130" r="4" fill="rgba(139,120,180,.25)"/>
  <circle cx="200" cy="100" r="3" fill="rgba(139,120,180,.28)"/>

  <!-- Stars -->
  <g fill="#FFD700" filter="url(#starGlow)">
    <circle cx="380" cy="80" r="1.4"/>
    <circle cx="480" cy="140" r="1.2"/>
    <circle cx="560" cy="60" r="1.6"/>
    <circle cx="720" cy="90" r="1.3"/>
    <circle cx="860" cy="50" r="1.5"/>
    <circle cx="1020" cy="110" r="1.2"/>
    <circle cx="1120" cy="70" r="1.4"/>
    <circle cx="640" cy="180" r="1"/>
    <circle cx="340" cy="200" r="1.1"/>
  </g>
  <g fill="#EAEAF8" opacity="0.75" filter="url(#starGlow)">
    <circle cx="420" cy="180" r="1"/>
    <circle cx="600" cy="150" r="1.2"/>
    <circle cx="780" cy="200" r="0.9"/>
    <circle cx="920" cy="150" r="1"/>
    <circle cx="1080" cy="230" r="1.1"/>
    <circle cx="500" cy="220" r="0.9"/>
    <circle cx="680" cy="230" r="1"/>
  </g>

  <!-- Distant Hogwarts silhouette on horizon -->
  <g fill="#0B0A20" opacity="0.86">
    <path d="M0 500 L0 420 L60 420 L60 380 L90 380 L90 400 L130 400 L130 350 L160 350 L160 340 L180 340 L180 320 L200 320 L200 340 L220 340 L220 400 L280 400 L280 370 L320 370 L320 410 L360 410 L360 500 Z"/>
    <path d="M840 500 L840 400 L890 400 L890 380 L920 380 L920 340 L950 340 L950 300 L980 300 L980 340 L1010 340 L1010 380 L1080 380 L1080 400 L1140 400 L1140 430 L1200 430 L1200 500 Z"/>
    <!-- towers with pointed roofs -->
    <path d="M155 340 L170 305 L185 340 Z" fill="#0B0A20"/>
    <path d="M195 320 L210 285 L225 320 Z" fill="#0B0A20"/>
    <path d="M945 300 L965 260 L985 300 Z" fill="#0B0A20"/>
    <!-- lit windows -->
    <rect x="70" y="410" width="4" height="6" fill="#FFD700" opacity="0.8"/>
    <rect x="85" y="410" width="4" height="6" fill="#FFD700" opacity="0.65"/>
    <rect x="135" y="360" width="4" height="6" fill="#FFD700" opacity="0.7"/>
    <rect x="145" y="360" width="4" height="6" fill="#FFD700" opacity="0.5"/>
    <rect x="895" y="390" width="4" height="6" fill="#FFD700" opacity="0.75"/>
    <rect x="955" y="315" width="4" height="6" fill="#FFD700" opacity="0.6"/>
    <rect x="1015" y="360" width="4" height="6" fill="#FFD700" opacity="0.7"/>
  </g>

  <!-- Three Quidditch hoops at right — layered depth -->
  <g transform="translate(950,220)">
    <!-- back post -->
    <rect x="-3" y="0" width="6" height="180" fill="url(#hoopMetal)" opacity="0.6"/>
    <ellipse cx="0" cy="0" rx="38" ry="10" fill="none" stroke="url(#hoopMetal)" stroke-width="4" opacity="0.6"/>
  </g>
  <g transform="translate(1030,180)">
    <!-- middle -->
    <rect x="-3.5" y="0" width="7" height="220" fill="url(#hoopMetal)" opacity="0.85"/>
    <ellipse cx="0" cy="0" rx="48" ry="13" fill="none" stroke="url(#hoopMetal)" stroke-width="5" opacity="0.85"/>
  </g>
  <g transform="translate(1110,150)">
    <!-- front -->
    <rect x="-4" y="0" width="8" height="250" fill="url(#hoopMetal)"/>
    <ellipse cx="0" cy="0" rx="58" ry="16" fill="none" stroke="url(#hoopMetal)" stroke-width="6"/>
  </g>

  <!-- Golden Snitch mid-air, center-left with glow -->
  <g transform="translate(560,220)">
    <circle r="46" fill="url(#snitchGlow)"/>
    <!-- wings -->
    <path d="M-30 0 Q-18 -20 -4 -6 Q-16 4 -30 0 Z" fill="#EAEAF8" opacity="0.85" stroke="#B8B8E8" stroke-width="0.4"/>
    <path d="M30 0 Q18 -20 4 -6 Q16 4 30 0 Z" fill="#EAEAF8" opacity="0.85" stroke="#B8B8E8" stroke-width="0.4"/>
    <!-- feather lines -->
    <path d="M-8 -3 L-24 -8 M-6 0 L-26 -2 M-8 3 L-22 4" stroke="#B8B8E8" stroke-width="0.3" fill="none"/>
    <path d="M8 -3 L24 -8 M6 0 L26 -2 M8 3 L22 4" stroke="#B8B8E8" stroke-width="0.3" fill="none"/>
    <!-- body -->
    <circle r="8" fill="url(#snitchBody)" stroke="#8B6914" stroke-width="0.6"/>
    <ellipse cx="-2" cy="-2" rx="2.5" ry="1.6" fill="#FFF4A0" opacity="0.85"/>
  </g>

  <!-- Motion trail of Snitch -->
  <path d="M480 240 Q520 220 550 220" stroke="rgba(255,215,0,.35)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M460 260 Q510 240 540 235" stroke="rgba(255,215,0,.20)" stroke-width="1" fill="none" stroke-linecap="round"/>

  <!-- Three Quidditch players on brooms -->
  <use href="#broomPlayer" x="360" y="180" width="80" height="40" transform="rotate(-8 400 200)"/>
  <use href="#broomPlayer" x="700" y="280" width="80" height="40" transform="rotate(6 740 300)"/>
  <use href="#broomPlayer" x="820" y="140" width="80" height="40" transform="rotate(-4 860 160)"/>

  <!-- Ground horizon fade -->
  <rect x="0" y="380" width="1200" height="120" fill="url(#ground)"/>

  <!-- Bottom pitch grass hint -->
  <ellipse cx="600" cy="510" rx="900" ry="60" fill="rgba(46,204,113,.14)" filter="url(#blur3)"/>
</svg>
