<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="snitch" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF4A0"/>
      <stop offset="60%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Left wing -->
  <path d="M14 50 Q28 28 46 48 Q30 56 14 50 Z" fill="#EAEAF8" opacity="0.88" stroke="#B8B8E8" stroke-width="0.6"/>
  <!-- Wing feather lines -->
  <path d="M20 47 L36 50" stroke="#B8B8E8" stroke-width="0.4" fill="none"/>
  <path d="M20 51 L38 52" stroke="#B8B8E8" stroke-width="0.4" fill="none"/>
  <!-- Right wing -->
  <path d="M86 50 Q72 28 54 48 Q70 56 86 50 Z" fill="#EAEAF8" opacity="0.88" stroke="#B8B8E8" stroke-width="0.6"/>
  <path d="M80 47 L64 50" stroke="#B8B8E8" stroke-width="0.4" fill="none"/>
  <path d="M80 51 L62 52" stroke="#B8B8E8" stroke-width="0.4" fill="none"/>
  <!-- Snitch body -->
  <circle cx="50" cy="50" r="16" fill="url(#snitch)" stroke="#8B6914" stroke-width="1.2" filter="url(#glow)"/>
  <!-- Body seam lines -->
  <path d="M50 34 Q54 42 50 50 Q46 58 50 66" stroke="#8B6914" stroke-width="0.6" fill="none" opacity="0.5"/>
  <path d="M34 50 Q42 46 50 50 Q58 54 66 50" stroke="#8B6914" stroke-width="0.6" fill="none" opacity="0.5"/>
  <!-- Highlight -->
  <ellipse cx="45" cy="45" rx="4.5" ry="3" fill="#FFF4A0" opacity="0.8"/>
</svg>
