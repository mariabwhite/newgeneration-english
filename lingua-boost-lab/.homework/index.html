<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Моя домашка · Lingua Boost Lab</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#172033;--muted:#64748b;--line:#dbe3ef;--accent:#7c3aed;--accent-2:#f59e0b;--danger:#dc2626}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.top{position:sticky;top:0;z-index:10;background:rgba(246,247,251,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-inner{max-width:1240px;margin:0 auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:900;letter-spacing:.02em}
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.48;cursor:not-allowed}
main{max-width:1240px;margin:0 auto;padding:24px 18px 56px}
.hero{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:18px}
h1{font-size:clamp(1.45rem,3vw,2.4rem);margin:0 0 8px}
.sub{color:var(--muted);line-height:1.5}
.list{display:grid;gap:16px}
.item{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 10px 24px rgba(15,23,42,.06)}
.kind{display:inline-flex;margin-bottom:10px;border-radius:999px;background:#ede9fe;color:#5b21b6;padding:4px 10px;font-size:.75rem;font-weight:900;text-transform:uppercase;letter-spacing:.06em}
.q{font-weight:850;font-size:1.02rem;line-height:1.35;margin:0 42px 8px 0}
.meta{color:var(--muted);line-height:1.5;margin-top:5px}
.raw{border:1px solid var(--line);border-radius:10px;background:#fff;max-height:620px;overflow:auto;padding:14px;margin-top:10px}
.raw section{margin:0!important;max-width:none!important}
.raw img{max-width:100%;height:auto}
.answer{margin-top:14px}
.answer label{display:block;font-weight:900;margin:0 0 7px;color:#334155}
.answer textarea{width:100%;min-height:132px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:12px 13px;font:500 1rem/1.5 inherit;color:var(--text);background:#fff}
.answer textarea:focus{outline:2px solid rgba(124,58,237,.22);border-color:var(--accent)}
.rm{position:absolute;top:10px;right:10px;border:0;background:#fee2e2;color:#991b1b;border-radius:8px;width:32px;height:32px;font-size:18px;cursor:pointer}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:34px;text-align:center;color:var(--muted);line-height:1.6}
.actions{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(246,247,251,0),var(--bg) 28%);padding-top:24px;margin-top:18px;display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 14px;border-radius:999px;font-weight:800;opacity:0;pointer-events:none;transition:.18s;z-index:20}
.toast.show{opacity:1}
@media(max-width:680px){.top-inner,.hero{align-items:stretch;flex-direction:column}.actions{justify-content:stretch}.actions .btn{justify-content:center;width:100%}.raw{max-height:none}.q{margin-right:38px}}
</style>
<style id="voyager-homework-skin">
:root{
  --bg:#050712;--card:#10182b;--card-2:#16213a;--text:#eef4ff;--muted:#9aa8c7;
  --line:rgba(150,170,220,.24);--line-2:rgba(245,191,68,.28);
  --brand:#9b7fe8;--brand-2:#f7bf45;--accent:#4fe1c0;--danger:#ff6b7a;
  --display:Unbounded,Inter,system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;
}
html{background:#050712}
body{
  min-height:100vh;
  background:
    radial-gradient(circle at 16% 8%,rgba(155,127,232,.24),transparent 30%),
    radial-gradient(circle at 84% 0%,rgba(79,225,192,.16),transparent 26%),
    linear-gradient(180deg,#050712 0%,#081124 44%,#050712 100%);
  color:var(--text);
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.34;
  background-image:
    radial-gradient(circle at 20% 30%,rgba(255,255,255,.55) 0 1px,transparent 1.5px),
    radial-gradient(circle at 70% 12%,rgba(255,255,255,.38) 0 1px,transparent 1.5px),
    radial-gradient(circle at 82% 72%,rgba(255,255,255,.34) 0 1px,transparent 1.5px);
  background-size:260px 260px,330px 330px,420px 420px;
}
.top{background:rgba(5,7,18,.78);border-bottom:1px solid var(--line);box-shadow:0 16px 38px rgba(0,0,0,.24)}
.brand{font-family:var(--display);font-size:.9rem;color:var(--brand-2)}
.btn{background:rgba(16,24,43,.72);border-color:var(--line);color:var(--text);border-radius:999px}
.btn.primary{background:linear-gradient(135deg,var(--brand),#d946a0);border-color:transparent;color:#fff;box-shadow:0 12px 28px rgba(155,127,232,.28)}
.btn.danger{color:#ffd0d7;border-color:rgba(255,107,122,.36)}
main{position:relative;z-index:1;max-width:1240px;padding-top:30px}
.hero{border:1px solid var(--line);border-radius:18px;padding:24px;background:linear-gradient(135deg,rgba(16,24,43,.88),rgba(9,16,34,.72));box-shadow:0 24px 70px rgba(0,0,0,.28)}
h1{font-family:var(--display);color:var(--text);letter-spacing:0}
.sub{color:var(--muted);font-family:var(--mono);font-size:.82rem}
.item{background:transparent;border:0;box-shadow:none;padding:0}
.kind{margin:0 0 10px 2px;background:rgba(247,191,69,.13);border:1px solid var(--line-2);color:var(--brand-2);font-family:var(--mono)}
.q{font-family:var(--display);font-size:clamp(1.05rem,2vw,1.45rem);color:var(--text);margin:0 46px 12px 2px}
.meta{color:var(--muted)}
.rm{background:rgba(255,107,122,.13);color:#ffd0d7;border:1px solid rgba(255,107,122,.28);border-radius:999px}
.raw{max-height:none;overflow:visible;padding:0;border:0;background:transparent}
.raw section,.raw .section{
  width:100%!important;max-width:none!important;margin:0!important;
  border:1px solid var(--line)!important;border-radius:18px!important;
  background:linear-gradient(135deg,rgba(16,24,43,.94),rgba(8,14,30,.9))!important;
  box-shadow:0 24px 70px rgba(0,0,0,.30)!important;
  padding:clamp(18px,3vw,30px)!important;color:var(--text)!important;
}
.raw .section-hdr,.raw .section-head{display:flex!important;align-items:center!important;gap:14px!important;margin-bottom:12px!important}
.raw .section-num{display:inline-flex!important;align-items:center!important;justify-content:center!important;width:42px!important;height:42px!important;border-radius:12px!important;background:linear-gradient(135deg,var(--brand),#d946a0)!important;color:#fff!important;font:900 .8rem/1 var(--mono)!important}
.raw h1,.raw h2,.raw h3{font-family:var(--display)!important;color:var(--text)!important;letter-spacing:0!important}
.raw h2{font-size:clamp(1.15rem,2.6vw,2rem)!important;margin:0!important}
.raw p,.raw li,.raw .section-sub{color:var(--muted)!important;line-height:1.65!important}
.raw .section-sub{font-family:var(--mono)!important;font-size:.84rem!important;margin-bottom:16px!important}
.raw img,.raw .lesson-img{display:block!important;width:100%!important;max-width:100%!important;height:auto!important;border-radius:16px!important;border:1px solid var(--line)!important;margin:16px 0!important}
.raw .story-card,.raw .listen-box,.raw .reading-card,.raw .q-row,.raw .oc-row,.raw .cloze-row,.raw .wf-row,.raw .mic-row,.raw .challenge,.raw .task-card{
  background:rgba(255,255,255,.045)!important;border:1px solid var(--line)!important;border-radius:14px!important;color:var(--text)!important;
}
.raw .q-row,.raw .oc-row,.raw .cloze-row,.raw .wf-row,.raw .mic-row{padding:12px 14px!important;margin:10px 0!important}
.raw button:not(.rm){border-radius:999px!important}
.raw input,.raw textarea{background:#071124!important;border:1px solid var(--line)!important;color:var(--text)!important;border-radius:10px!important}
.answer{
  margin-top:16px;border:1px solid var(--line-2);border-radius:18px;
  background:linear-gradient(135deg,rgba(247,191,69,.10),rgba(155,127,232,.10));
  padding:16px;
}
.answer label{font-family:var(--mono);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--brand-2)}
.answer textarea{min-height:160px;background:#081124;border-color:var(--line);color:var(--text);border-radius:14px}
.answer textarea::placeholder{color:#64708e}
.answer textarea:focus{outline:2px solid rgba(247,191,69,.24);border-color:var(--brand-2)}
.empty{background:rgba(16,24,43,.78);border-color:var(--line);color:var(--muted)}
.actions{background:linear-gradient(180deg,rgba(5,7,18,0),#050712 32%);padding-bottom:max(14px,env(safe-area-inset-bottom))}
.toast{background:#111827;border:1px solid var(--line);box-shadow:0 16px 38px rgba(0,0,0,.36)}
@media(max-width:680px){
  .hero{padding:18px;border-radius:14px}
  .raw section,.raw .section{padding:16px!important;border-radius:14px!important}
  .raw .section-hdr,.raw .section-head{align-items:flex-start!important}
  .raw .section-num{width:34px!important;height:34px!important;border-radius:10px!important}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">Lingua Boost Lab · Моя домашка</div>
    <a class="btn" id="backLink" href="/lingua-boost-lab/">← К уроку</a>
  </div>
</header>
<main>
  <section class="hero">
    <div>
      <h1>Моя домашка</h1>
      <div class="sub" id="lessonLine">Задания из урока.</div>
    </div>
  </section>
  <section class="list" id="list"></section>
  <section class="actions">
    <button class="btn danger" id="clearBtn" type="button">Очистить</button>
    <button class="btn primary" id="sendBtn" type="button">Отправить учителю</button>
  </section>
</main>
<div class="toast" id="toast"></div>
<script>
(function(){
  var SUPABASE_URL = 'https://iqzlphbvmfgoygnozbya.supabase.co';
  var SUPABASE_ANON = 'sb_publishable_hYhBk3xS90uouUFd_DZWUw_sOv-6JGO';
  var params = new URLSearchParams(location.search);
  var lesson = params.get('lesson') || '/lingua-boost-lab/';
  var key = 'lab-hw:' + lesson;
  var legacyKey = 'lab_hw_v1_' + lesson;

  // v2 · 2026-07-03 · применяем theme урока (сохраняется lab-tabs.js v11 при клике «Моя домашка»)
  try {
    var themeRaw = localStorage.getItem('lab-theme:' + lesson);
    if (themeRaw) {
      var theme = JSON.parse(themeRaw);
      var root = document.documentElement;
      var bodyBg = theme.__bodyBg;
      Object.keys(theme).forEach(function(k){
        if (k === '__bodyBg') return;
        if (theme[k]) root.style.setProperty(k, theme[k]);
      });
      // отключаем voyager-skin (тёмный navy) когда есть per-lesson theme —
      // фон/карточки/текст пойдут из --bg/--card/--text урока
      var kill = document.getElementById('voyager-homework-skin');
      if (kill) kill.disabled = true;
      var override = document.createElement('style');
      override.textContent =
        'html,body{background:' + (theme['--bg'] || bodyBg || '#fff') + ' !important;color:' + (theme['--text'] || '#172033') + ' !important}' +
        'body::before{display:none !important}' +
        '.top{background:' + (theme['--card'] || '#fff') + 'ee !important;border-color:' + (theme['--line'] || '#e5e7eb') + ' !important}' +
        '.brand{color:' + (theme['--accent'] || '#7c3aed') + ' !important;font-family:' + (theme['--display'] || 'inherit') + ' !important}' +
        '.hero{background:' + (theme['--card'] || '#fff') + ' !important;border-color:' + (theme['--line'] || '#e5e7eb') + ' !important;color:' + (theme['--text'] || '#172033') + ' !important;box-shadow:0 8px 24px rgba(0,0,0,.08) !important}' +
        'h1{color:' + (theme['--text'] || '#172033') + ' !important;font-family:' + (theme['--display'] || 'inherit') + ' !important}' +
        '.sub{color:' + (theme['--muted'] || '#64748b') + ' !important}' +
        '.item,.raw section,.raw .section{background:' + (theme['--card'] || '#fff') + ' !important;border-color:' + (theme['--line'] || '#e5e7eb') + ' !important;color:' + (theme['--text'] || '#172033') + ' !important;box-shadow:0 8px 20px rgba(0,0,0,.06) !important}' +
        '.raw h1,.raw h2,.raw h3,.raw p,.raw li{color:' + (theme['--text'] || '#172033') + ' !important}' +
        '.raw p,.raw li,.raw .section-sub{color:' + (theme['--muted'] || '#64748b') + ' !important}' +
        '.kind{background:' + (theme['--accent'] || '#7c3aed') + '22 !important;color:' + (theme['--accent'] || '#7c3aed') + ' !important;border-color:' + (theme['--accent'] || '#7c3aed') + '55 !important}' +
        '.q{color:' + (theme['--text'] || '#172033') + ' !important;font-family:' + (theme['--display'] || 'inherit') + ' !important}' +
        '.btn.primary{background:' + (theme['--accent'] || '#7c3aed') + ' !important;border-color:' + (theme['--accent'] || '#7c3aed') + ' !important;color:' + (theme['--accent-on'] || '#fff') + ' !important;background-image:none !important;box-shadow:0 6px 16px ' + (theme['--accent'] || '#7c3aed') + '44 !important}' +
        '.answer{background:' + (theme['--card'] || '#fff') + ' !important;border-color:' + (theme['--line'] || '#e5e7eb') + ' !important;background-image:none !important}' +
        '.answer label{color:' + (theme['--accent'] || '#7c3aed') + ' !important;font-family:' + (theme['--display'] || 'inherit') + ' !important}' +
        '.answer textarea{background:' + (theme['--bg'] || '#fff') + ' !important;color:' + (theme['--text'] || '#172033') + ' !important;border-color:' + (theme['--line'] || '#e5e7eb') + ' !important}' +
        '.empty{background:' + (theme['--card'] || '#fff') + ' !important;border-color:' + (theme['--line'] || '#e5e7eb') + ' !important;color:' + (theme['--muted'] || '#64748b') + ' !important}' +
        '.actions{background:linear-gradient(180deg,transparent,' + (theme['--bg'] || '#fff') + ' 30%) !important}';
      document.head.appendChild(override);
    }
  } catch(e){}
  var list = document.getElementById('list');
  var sendBtn = document.getElementById('sendBtn');
  var clearBtn = document.getElementById('clearBtn');
  document.getElementById('backLink').href = lesson;
  document.getElementById('lessonLine').textContent = lesson;

  function escapeHTML(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function load(){
    try {
      var raw = localStorage.getItem(key);
      if (!raw && localStorage.getItem(legacyKey)) {
        raw = localStorage.getItem(legacyKey);
        localStorage.setItem(key, raw);
      }
      return JSON.parse(raw || '[]');
    } catch(e) { return []; }
  }
  function save(arr){ localStorage.setItem(key, JSON.stringify(arr)); }
  function short(s,n){s=String(s||'');return s.length>n?s.slice(0,n-1)+'…':s;}
  function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2400);}
  function kindLabel(k){return ({mcq:'Тест',tfns:'True / False / NS',gap:'Пропуск',wf:'Word formation',match:'Match',builder:'Sentence',mic:'Speaking',writing:'Writing',vocab:'Слово','raw-block':'Блок'}[k]||k);}
  function getName(){
    try {
      var modern = localStorage.getItem('lab-student-name');
      if (modern && modern[0] === '{') {
        var data = JSON.parse(modern);
        if (data && data.name) return data.name;
      }
      return modern || localStorage.getItem('lab_student_name') || localStorage.getItem('nge_student_name') || '';
    } catch(e) { return ''; }
  }
  function setName(n){
    try {
      localStorage.setItem('lab-student-name', JSON.stringify({name:n, ts:Date.now()}));
      localStorage.setItem('lab_student_name', n);
      localStorage.setItem('nge_student_name', n);
    } catch(e) {}
  }
  function roomFor(name){return 'student-' + (name||'anonymous').toLowerCase().replace(/[^a-zа-яё0-9]+/gi,'-').replace(/^-+|-+$/g,'').slice(0,40);}
  function answerLabel(it){
    if (it.kind === 'mic') return 'Ссылка на запись / текст ответа';
    if (it.kind === 'vocab') return 'Мои предложения со словами';
    if (it.kind === 'writing' || it.kind === 'raw-block') return 'Мой ответ';
    return 'Мой ответ / что получилось';
  }
  function syncAnswers(){
    var arr = load();
    list.querySelectorAll('[data-answer-i]').forEach(function(el){
      var idx = +el.getAttribute('data-answer-i');
      if (arr[idx]) arr[idx].student_answer = el.value;
    });
    save(arr);
    return arr;
  }
  function render(){
    var arr = load();
    sendBtn.disabled = !arr.length;
    clearBtn.style.display = arr.length ? '' : 'none';
    if (!arr.length) {
      list.innerHTML = '<div class="empty">Пока ничего не положили в домашку.<br>Вернитесь к уроку и нажмите <strong>+</strong> у нужного блока.</div>';
      return;
    }
    list.innerHTML = arr.map(function(it,i){
      var answer = escapeHTML(it.student_answer || '');
      var meta = [];
      if (it.section_title && it.section_title !== it.question) meta.push('<div class="meta"><b>Раздел:</b> '+escapeHTML(it.section_title)+'</div>');
      if (it.correct && it.kind !== 'raw-block') meta.push('<div class="meta"><b>'+(it.kind==='vocab'?'Перевод':'Ключ')+':</b> '+escapeHTML(it.correct)+'</div>');
      var body = '';
      if (it.kind === 'raw-block' && it.html) {
        body = '<div class="raw">'+(it.css ? '<style>'+it.css+'</style>' : '')+it.html+'</div>';
      }
      return '<article class="item" data-i="'+i+'">'+
        '<button class="rm" type="button" title="Убрать">×</button>'+
        '<span class="kind">'+escapeHTML(kindLabel(it.kind))+'</span>'+
        '<div class="q">'+escapeHTML(it.question || '(без вопроса)')+'</div>'+
        meta.join('')+
        body+
        '<div class="answer"><label for="ans-'+i+'">'+escapeHTML(answerLabel(it))+'</label><textarea id="ans-'+i+'" data-answer-i="'+i+'" placeholder="Пиши ответ здесь. Он сохранится и уйдёт учителю при отправке.">'+answer+'</textarea></div>'+
      '</article>';
    }).join('');
    list.querySelectorAll('.rm').forEach(function(b){
      b.onclick = function(){
        var arr = syncAnswers();
        arr.splice(+b.closest('.item').dataset.i, 1);
        save(arr);
        render();
      };
    });
    list.querySelectorAll('[data-answer-i]').forEach(function(el){
      el.addEventListener('input', syncAnswers);
    });
  }
  clearBtn.onclick = function(){
    if (confirm('Удалить все задания из домашки?')) {
      save([]);
      render();
    }
  };
  sendBtn.onclick = async function(){
    var arr = syncAnswers();
    if (!arr.length) return;
    var name = getName() || prompt('Как тебя зовут? Учитель увидит это имя.') || '';
    name = name.trim();
    if (name) setName(name);
    var room = roomFor(name);
    sendBtn.disabled = true;
    sendBtn.textContent = 'Отправляю...';
    var ok = false;
    var err = '';
    try {
      var misses = arr.map(function(it,i){
        var answer = it.student_answer ? 'Ответ: ' + short(it.student_answer, 140) : 'Без ответа';
        return (i+1)+'. '+short(it.question || '(без вопроса)', 90)+' · '+answer;
      });
      var resp = await fetch('/api/homework/submit', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          student_name:name || 'аноним',
          student_id:room,
          lesson_path:lesson,
          lesson_title:lesson,
          section_id:'homework-batch',
          items:arr,
          score:0,
          total:arr.length,
          pct:0,
          misses:misses
        })
      });
      var json = await resp.json().catch(function(){return {};});
      if (resp.ok && json.ok) ok = true;
      else err = json.error || ('D1 HTTP ' + resp.status);
    } catch(e) {
      err = 'D1 fetch failed: ' + (e.message || e);
    }
    if (!ok) try {
      if (!window.supabase) {
        await new Promise(function(res,rej){
          var s = document.createElement('script');
          s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js';
          s.onload = res;
          s.onerror = rej;
          document.head.appendChild(s);
        }).catch(function(){});
      }
      var client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
      var sb = await client.from('lab_submissions').insert({
        room_id:room,
        lesson_path:lesson,
        section_id:'homework-batch',
        section_title:'Homework · '+arr.length+' items',
        student_role:name ? ('homework:'+name) : 'homework:anonymous',
        score:0,
        total:arr.length,
        misses:arr
      });
      if (!sb.error) { ok = true; err = ''; }
    } catch(e) {}
    sendBtn.disabled = false;
    sendBtn.textContent = 'Отправить учителю';
    if (ok) {
      save([]);
      render();
      toast('Домашка отправлена · '+arr.length+' блок(ов)');
    } else {
      toast('Не получилось отправить: '+(err || 'попробуйте ещё раз'));
    }
  };
  render();
})();
</script>
</body>
</html>
