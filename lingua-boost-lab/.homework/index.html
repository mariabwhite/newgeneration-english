<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Моя домашка · Lingua Boost Lab</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#172033;--muted:#64748b;--line:#dbe3ef;--accent:#7c3aed;--danger:#dc2626}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.top{position:sticky;top:0;z-index:10;background:rgba(246,247,251,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-inner{max-width:1240px;margin:0 auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:900;letter-spacing:.02em}
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.48;cursor:not-allowed}
main{max-width:1240px;margin:0 auto;padding:24px 18px 56px}
.hero{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:18px}
h1{font-size:clamp(1.45rem,3vw,2.4rem);margin:0 0 8px}
.sub{color:var(--muted);line-height:1.5}
.list{display:grid;gap:14px}
.item{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 10px 24px rgba(15,23,42,.06)}
.kind{display:inline-flex;margin-bottom:10px;border-radius:999px;background:#ede9fe;color:#5b21b6;padding:4px 10px;font-size:.75rem;font-weight:900;text-transform:uppercase;letter-spacing:.06em}
.q{font-weight:850;font-size:1.02rem;line-height:1.35;margin-bottom:8px}
.meta{color:var(--muted);line-height:1.5;margin-top:5px}
.raw{border:1px solid var(--line);border-radius:10px;background:#fff;max-height:none;overflow:auto;padding:14px;margin-top:8px}
.rm{position:absolute;top:10px;right:10px;border:0;background:#fee2e2;color:#991b1b;border-radius:8px;width:32px;height:32px;font-size:18px;cursor:pointer}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:34px;text-align:center;color:var(--muted);line-height:1.6}
.actions{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(246,247,251,0),var(--bg) 28%);padding-top:24px;margin-top:18px;display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 14px;border-radius:999px;font-weight:800;opacity:0;pointer-events:none;transition:.18s}
.toast.show{opacity:1}
@media(max-width:680px){.top-inner,.hero{align-items:stretch;flex-direction:column}.actions{justify-content:stretch}.actions .btn{justify-content:center;width:100%}}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">Lingua Boost Lab · Моя домашка</div>
    <a class="btn" id="backLink" href="/lingua-boost-lab/">← К уроку</a>
  </div>
</header>
<main>
  <section class="hero">
    <div>
      <h1>Моя домашка</h1>
      <div class="sub" id="lessonLine">Задания из урока.</div>
    </div>
  </section>
  <section class="list" id="list"></section>
  <section class="actions">
    <button class="btn danger" id="clearBtn" type="button">Очистить</button>
    <button class="btn primary" id="sendBtn" type="button">Отправить учителю</button>
  </section>
</main>
<div class="toast" id="toast"></div>
<script>
(function(){
  var SUPABASE_URL='https://glntukvcmxryjixgozmc.supabase.co';
  var SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdsbnR1a3ZjbXhyeWppeGdvem1jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDY0NzY5MTcsImV4cCI6MjA2MjA1MjkxN30.S-hEUGU6j5GmM6w7LtgEK5AewzS4_2ppGQg45cbkEoE';
  var params=new URLSearchParams(location.search);
  var lesson=params.get('lesson')||'/lingua-boost-lab/';
  var key='lab_hw_v1_'+lesson;
  var list=document.getElementById('list');
  var sendBtn=document.getElementById('sendBtn');
  var clearBtn=document.getElementById('clearBtn');
  document.getElementById('backLink').href=lesson;
  document.getElementById('lessonLine').textContent=lesson;
  function escapeHTML(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function load(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch(e){return []}}
  function save(arr){localStorage.setItem(key,JSON.stringify(arr))}
  function short(s,n){s=String(s||'');return s.length>n?s.slice(0,n-1)+'…':s}
  function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2200)}
  function kindLabel(k){return ({mcq:'Тест',tfns:'True / False / NS',gap:'Пропуск',wf:'Word formation',match:'Match',builder:'Sentence',mic:'Speaking',writing:'Writing',vocab:'Слово','raw-block':'Секция'}[k]||k)}
  function getName(){try{return localStorage.getItem('lab_student_name')||localStorage.getItem('nge_student_name')||''}catch(e){return ''}}
  function setName(n){try{localStorage.setItem('lab_student_name',n);localStorage.setItem('nge_student_name',n)}catch(e){}}
  function roomFor(name){return 'hw_'+(name||'anonymous').toLowerCase().replace(/[^a-zа-я0-9]+/gi,'_').replace(/^_+|_+$/g,'').slice(0,40)}
  function render(){
    var arr=load();
    sendBtn.disabled=!arr.length;
    clearBtn.style.display=arr.length?'':'none';
    if(!arr.length){list.innerHTML='<div class="empty">Пока ничего не положили в домашку.<br>Вернитесь к уроку и нажмите + рядом с нужными заданиями.</div>';return}
    list.innerHTML=arr.map(function(it,i){
      if(it.kind==='raw-block'&&it.html){return '<article class="item" data-i="'+i+'"><button class="rm" type="button" title="Убрать">×</button><span class="kind">Секция</span><div class="q">'+escapeHTML(it.question||'Block')+'</div><div class="raw">'+it.html+'</div></article>'}
      var meta=[];
      if(it.section_title) meta.push('<div class="meta"><b>Раздел:</b> '+escapeHTML(it.section_title)+'</div>');
      if(it.correct) meta.push('<div class="meta"><b>'+(it.kind==='vocab'?'Перевод':'Правильный ответ')+':</b> '+escapeHTML(it.correct)+'</div>');
      if(it.student_answer) meta.push('<div class="meta"><b>'+(it.kind==='vocab'?'Пример':'Мой ответ')+':</b> '+escapeHTML(it.student_answer)+'</div>');
      return '<article class="item" data-i="'+i+'"><button class="rm" type="button" title="Убрать">×</button><span class="kind">'+escapeHTML(kindLabel(it.kind))+'</span><div class="q">'+escapeHTML(it.question||'(без вопроса)')+'</div>'+meta.join('')+'</article>';
    }).join('');
    list.querySelectorAll('.rm').forEach(function(b){b.onclick=function(){var arr=load();arr.splice(+b.closest('.item').dataset.i,1);save(arr);render();};});
  }
  clearBtn.onclick=function(){if(confirm('Удалить все задания из домашки?')){save([]);render();}};
  sendBtn.onclick=async function(){
    var arr=load(); if(!arr.length) return;
    var name=getName()||prompt('Как тебя зовут? (учитель увидит это имя)')||'';
    name=name.trim(); if(name) setName(name);
    var room=roomFor(name);
    sendBtn.disabled=true; sendBtn.textContent='Отправляю...';
    var ok=false, err='';
    try{
      var misses=arr.map(function(it,i){return (i+1)+'. '+short(it.question||'(без вопроса)',90);});
      var resp=await fetch('/api/homework/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_name:name||'аноним',student_id:room,lesson_path:lesson,lesson_title:lesson,section_id:'homework-batch',items:arr,score:0,total:arr.length,pct:0,misses:misses})});
      var json=await resp.json().catch(function(){return{}});
      if(resp.ok&&json.ok) ok=true; else err=json.error||('D1 HTTP '+resp.status);
    }catch(e){err='D1 fetch failed: '+(e.message||e)}
    if(!ok) try{
      if(!window.supabase){await new Promise(function(res,rej){var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js';s.onload=res;s.onerror=rej;document.head.appendChild(s);}).catch(function(){});}
      var client=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON);
      var sb=await client.from('lab_submissions').insert({room_id:room,lesson_path:lesson,section_id:'homework-batch',section_title:'Homework · '+arr.length+' items',student_role:name?('homework:'+name):'homework:anonymous',score:0,total:arr.length,misses:arr});
      if(!sb.error){ok=true;err='';}
    }catch(e){}
    sendBtn.disabled=false; sendBtn.textContent='Отправить учителю';
    if(ok){save([]);render();toast('Домашка отправлена · '+arr.length+' заданий')} else toast('Не получилось отправить: '+(err||'попробуйте ещё'));
  };
  render();
})();
</script>
</body>
</html>
