<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>📥 Лента домашек · NG English</title>
<style>
:root{--bg:#0b1c33;--card:#fff;--text:#0b1c33;--muted:#4b5b75;--accent:#2563eb;--ok:#16a34a;--miss:#dc2626;--line:#dce7f3}
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(135deg,#0b1c33 0%,#1e3a8a 100%);font-family:-apple-system,Segoe UI,system-ui,sans-serif;color:var(--text);min-height:100vh;padding:20px}
.wrap{max-width:1100px;margin:0 auto}
header{background:#fff;border-radius:16px;padding:18px 24px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
h1{font-size:1.4rem;font-weight:800}
h1 .em{font-size:1.8rem;margin-right:8px}
.meta{font-size:.86rem;color:var(--muted)}
.controls{display:flex;gap:8px;align-items:center}
.controls input{padding:8px 12px;border:1.5px solid var(--line);border-radius:8px;font:600 .92rem inherit;width:130px}
.controls button{padding:8px 16px;border:none;background:var(--accent);color:#fff;font:700 .92rem inherit;border-radius:8px;cursor:pointer}
.auto-refresh{font-size:.82rem;color:var(--muted)}
.auto-refresh input{margin-right:6px}
.empty{background:#fff;border-radius:16px;padding:60px 24px;text-align:center;color:var(--muted);box-shadow:0 6px 24px rgba(0,0,0,.18)}
.empty .em{font-size:64px;display:block;margin-bottom:16px}
.sub{background:#fff;border-radius:14px;padding:16px 20px;margin-bottom:14px;box-shadow:0 4px 18px rgba(0,0,0,.10);border-left:4px solid var(--accent)}
.sub.score-high{border-left-color:var(--ok)}
.sub.score-low{border-left-color:var(--miss)}
.sub-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.sub-student{font-size:1.08rem;font-weight:800}
.sub-when{font-size:.82rem;color:var(--muted)}
.sub-lesson{font-size:.86rem;color:var(--muted);margin-bottom:8px}
.sub-lesson a{color:var(--accent);text-decoration:none}
.sub-lesson a:hover{text-decoration:underline}
.score-pill{display:inline-block;padding:4px 12px;border-radius:50px;font:800 .86rem inherit;background:rgba(22,163,74,.16);color:var(--ok)}
.score-pill.low{background:rgba(220,38,38,.16);color:var(--miss)}
.score-pill.mid{background:rgba(234,179,8,.18);color:#92400e}
.misses{margin-top:10px;padding:10px 14px;background:rgba(220,38,38,.06);border-radius:8px;font-size:.88rem}
.misses .head{font-weight:700;color:var(--miss);margin-bottom:6px}
.misses ul{margin-left:18px}
.items{margin-top:10px;padding:10px 14px;background:#f8fafc;border-radius:8px;font-size:.86rem;line-height:1.6}
.items details{cursor:pointer}
.items summary{font-weight:700;color:var(--muted);user-select:none}
.items[open] summary{margin-bottom:8px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:8px;padding:4px 0;border-bottom:1px solid #eee}
.item:last-child{border:none}
.item .q{color:var(--text)}
.item .a{font-family:Consolas,monospace;font-size:.84rem;color:var(--muted)}
.item .ok{color:var(--ok)}
.item .err{color:var(--miss)}
.pin-screen{background:#fff;max-width:380px;margin:80px auto;border-radius:16px;padding:32px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.20)}
.pin-screen h2{margin-bottom:16px}
.pin-screen input{width:100%;padding:14px;font-size:1.4rem;text-align:center;letter-spacing:.4em;border:2px solid var(--line);border-radius:10px;margin-bottom:14px}
.pin-screen button{width:100%;padding:14px;background:var(--accent);color:#fff;font:700 1rem inherit;border:none;border-radius:10px;cursor:pointer}
.pin-error{color:var(--miss);font-size:.86rem;margin-bottom:8px}
</style>
</head>
<body>

<div id="pin-screen" class="pin-screen">
  <h2>📥 Учительская лента</h2>
  <p class="pin-error" id="pin-error" style="display:none"></p>
  <input id="pin-input" type="password" inputmode="numeric" maxlength="4" placeholder="••••" autofocus>
  <button id="pin-btn">Войти</button>
</div>

<div id="app" class="wrap" style="display:none">
  <header>
    <div>
      <h1><span class="em">📥</span> Лента домашек</h1>
      <p class="meta" id="meta">Загружаю…</p>
    </div>
    <div class="controls">
      <label class="auto-refresh"><input type="checkbox" id="auto" checked>Auto 10s</label>
      <button id="refresh">↻ Обновить</button>
    </div>
  </header>
  <div id="list"></div>
</div>

<script>
const $ = s => document.querySelector(s);
let PIN = sessionStorage.getItem('teacher-pin') || '';

function show(app){ $('#pin-screen').style.display = app ? 'none':'block'; $('#app').style.display = app ? 'block':'none' }

async function tryPin(pin){
  try{
    const r = await fetch('/api/homework/feed?pin=' + encodeURIComponent(pin) + '&limit=1');
    return r.ok;
  } catch { return false }
}

$('#pin-btn').onclick = async () => {
  const v = $('#pin-input').value.trim();
  if (!v) return;
  $('#pin-error').style.display = 'none';
  if (await tryPin(v)) {
    PIN = v;
    sessionStorage.setItem('teacher-pin', v);
    show(true);
    load();
  } else {
    $('#pin-error').textContent = 'Неверный PIN';
    $('#pin-error').style.display = 'block';
  }
};
$('#pin-input').addEventListener('keydown', e => { if(e.key === 'Enter') $('#pin-btn').click() });

function fmtDate(ts){
  const d = new Date(ts * 1000);
  const today = new Date();
  const isToday = d.toDateString() === today.toDateString();
  if (isToday) return 'сегодня ' + d.toTimeString().slice(0,5);
  const yest = new Date(today); yest.setDate(yest.getDate()-1);
  if (d.toDateString() === yest.toDateString()) return 'вчера ' + d.toTimeString().slice(0,5);
  return d.toLocaleDateString('ru-RU') + ' ' + d.toTimeString().slice(0,5);
}

function escapeHTML(s){ return String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])) }

function pctClass(pct){
  if (pct >= 80) return 'score-high';
  if (pct >= 50) return '';
  return 'score-low';
}
function pctPillClass(pct){
  if (pct >= 80) return '';
  if (pct >= 50) return 'mid';
  return 'low';
}

function renderSub(s){
  let misses = [];
  try { misses = s.misses_json ? JSON.parse(s.misses_json) : [] } catch {}
  let items = [];
  try { items = s.items_json ? JSON.parse(s.items_json) : [] } catch {}

  const itemsHTML = items.length ? `
    <div class="items">
      <details>
        <summary>📋 Все ${items.length} ответов</summary>
        ${items.map(it => {
          const ok = it.ok || (it.student_answer && it.correct && String(it.student_answer).toLowerCase().trim() === String(it.correct).toLowerCase().trim());
          const mark = ok ? '<span class="ok">✓</span>' : '<span class="err">✗</span>';
          return `<div class="item"><span class="q">${escapeHTML(it.question || '—')}</span><span class="a">${escapeHTML(it.student_answer || '')}${it.correct && !ok ? ' → <b>' + escapeHTML(it.correct) + '</b>':''}</span>${mark}</div>`;
        }).join('')}
      </details>
    </div>` : '';

  const missesHTML = misses.length ? `
    <div class="misses">
      <div class="head">❌ Ошибки (${misses.length}):</div>
      <ul>${misses.map(m => `<li>${escapeHTML(m)}</li>`).join('')}</ul>
    </div>` : '';

  return `
    <div class="sub ${pctClass(s.pct)}">
      <div class="sub-head">
        <div>
          <div class="sub-student">🎒 ${escapeHTML(s.student_name)}</div>
          <div class="sub-lesson">${escapeHTML(s.lesson_title || s.lesson_path)} ${s.section_id ? '· ' + escapeHTML(s.section_id) : ''} · <a href="${escapeHTML(s.lesson_path)}" target="_blank">открыть урок →</a></div>
        </div>
        <div style="text-align:right">
          <div><span class="score-pill ${pctPillClass(s.pct)}">${s.score}/${s.total} · ${s.pct}%</span></div>
          <div class="sub-when">${fmtDate(s.created_at)}</div>
        </div>
      </div>
      ${missesHTML}
      ${itemsHTML}
    </div>`;
}

async function load(){
  if (!PIN) return;
  try{
    const r = await fetch('/api/homework/feed?pin=' + encodeURIComponent(PIN) + '&limit=100');
    if (r.status === 401) { sessionStorage.removeItem('teacher-pin'); PIN=''; show(false); return; }
    const data = await r.json();
    $('#meta').textContent = `${data.count} сдач · обновлено ${new Date().toTimeString().slice(0,8)}`;
    if (!data.submissions || !data.submissions.length){
      $('#list').innerHTML = '<div class="empty"><span class="em">📭</span><p>Пока никто ничего не сдал.<br>Когда ученик нажмёт «Отправить» — появится здесь.</p></div>';
      return;
    }
    $('#list').innerHTML = data.submissions.map(renderSub).join('');
  } catch (e) {
    $('#meta').textContent = 'Ошибка: ' + e.message;
  }
}

$('#refresh').onclick = load;
let timer = null;
function setAuto(on){
  if (timer) { clearInterval(timer); timer = null }
  if (on) timer = setInterval(load, 10000);
}
$('#auto').addEventListener('change', e => setAuto(e.target.checked));

if (PIN) {
  tryPin(PIN).then(ok => {
    if (ok) { show(true); load(); setAuto(true) }
    else { sessionStorage.removeItem('teacher-pin'); show(false) }
  });
} else {
  show(false);
}
</script>
</body>
</html>
