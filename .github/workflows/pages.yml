name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build publish artifact
        run: |
          rm -rf _site
          mkdir _site
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude '_archive/' \
            --exclude '_backups/' \
            --exclude '_internal/' \
            --exclude '_WIP_not_published_*/' \
            --exclude 'audit-shots/' \
            --exclude 'scripts/' \
            --exclude 'node_modules/' \
            --exclude '__pycache__/' \
            --exclude '*.bak' \
            --exclude '*.bak-*' \
            --exclude '*.backup-*' \
            --exclude '*.nullbackup-*' \
            --exclude '*.codex-backup-*' \
            --exclude '*.broken' \
            --exclude '*.tmp' \
            --exclude '*.log' \
            ./ _site/
          du -sh _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000
