<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кабинет · New Generation English</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="./style.css?v=1">
</head>
<body>

<header class="topbar">
  <a class="brand" href="https://newgeneration-english.ru/">
    <div class="brand-mark">NG</div>
    <div>
      <div class="brand-name">NG ENGLISH</div>
      <div class="brand-sub">Кабинет · v3</div>
    </div>
  </a>
  <button class="btn ghost" id="logoutBtn" hidden>Выйти</button>
</header>

<main class="shell">

  <!-- Login screen -->
  <section id="loginScreen" class="card center">
    <h1>Вход в кабинет</h1>
    <p class="sub">Введите 4-значный PIN — тот же, что раньше.</p>
    <form id="loginForm">
      <input id="pinInput" type="text" inputmode="numeric" pattern="\d{4}" maxlength="4"
             autocomplete="off" spellcheck="false" placeholder="0000" autofocus required>
      <button type="submit" id="loginBtn">Войти</button>
    </form>
    <div class="msg" id="loginMsg" hidden></div>
    <div class="sub small">
      Данные хранятся на защищённом сервере. Файлы договоров открываются по временным ссылкам
      (60 сек) и не кэшируются.
    </div>
  </section>

  <!-- Role picker (family PIN → выбор роли) -->
  <section id="rolePicker" class="card center" hidden>
    <h1 id="pickerGreeting">Здравствуйте</h1>
    <p class="sub">Вы заходите как:</p>
    <div class="role-buttons">
      <button class="role-btn" data-role="parent" id="rolePBtn">
        <div class="role-icon">👨‍👩‍👧</div>
        <div>Родитель</div>
      </button>
      <button class="role-btn" data-role="student" id="roleSBtn">
        <div class="role-icon">🎓</div>
        <div>Ученик</div>
      </button>
    </div>
  </section>

  <!-- Dashboard -->
  <section id="dashboard" hidden></section>

</main>

<script src="./app.js?v=1"></script>
</body>
</html>
